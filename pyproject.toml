[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huecheck"
version = "0.1.0"
description = "Analyze ANSI terminal output for contrast and color-vision accessibility"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
huecheck = "huecheck.cli:main"

[tool.setuptools]
packages = ["huecheck"]
include-package-data = true

[tool.setuptools.package-data]
huecheck = ["themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
